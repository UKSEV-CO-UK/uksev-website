# Deploy: cd worker && npx wrangler deploy        (needs `npm ci` at the repo root first)
# Secret: npx wrangler secret put GITHUB_TOKEN    (fine-grained, only UKSEV-CO-UK/uksev-website, Contents read/write, 90 days)
name = "uksev-admin-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Only reachable through the Access-protected route. No *.workers.dev, no preview URLs.
workers_dev = false
preview_urls = false
routes = [{ pattern = "uksev.co.uk/admin-api/*", zone_name = "uksev.co.uk" }]

[vars]
GITHUB_REPO = "UKSEV-CO-UK/uksev-website"
# Fill from the Access application (Zero Trust → Access → Applications). Empty = every request is refused.
ACCESS_TEAM_DOMAIN = ""   # e.g. "uksev.cloudflareaccess.com"
ACCESS_AUD = ""           # the application's Audience (AUD) tag
